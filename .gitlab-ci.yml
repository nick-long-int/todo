image: maven:3.9-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=./.m2/repository"
  
stages:
  - build
  - test
  - package
  - push-image

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUEST
      when: never
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - 'mvn clean compile'
  cache:
    paths:
      - ./target
      - ./.m2

test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  before_script:
    - export TESTCONTAINERS_RYUK_DISABLED=true
  script:
    - 'mvn test'
  cache:
    paths:
      - ./target
      - ./.m2

package:
  stage: package
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - 'mvn package -Dmaven.test.skip=true'
  artifacts:
    paths:
      - target/*.jar
  cache:
    policy: pull
    paths:
      - ./target
      - ./.m2

push-image:
  stage: push-image
  image: docker:latest
  before_script:
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
  script:
    - docker build -t $DOCKER_HUB_USER/springtodo:$CI_COMMIT_SHORT_SHA .
    - docker push $DOCKER_HUB_USER/springtodo:$CI_COMMIT_SHORT_SHA
  dependencies:
    - package
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  cache: {}